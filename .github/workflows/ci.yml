name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: peira-dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy Pages
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: peira-dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peira --branch="${{ github.head_ref || github.ref_name }}"

      - name: Add deployment output to summary
        env:
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          {
            echo "## Cloudflare Pages deployment"
            echo
            echo '```text'
            printf '%s\n' "$DEPLOY_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
